[workspace]
resolver = "3"
members = ["src-tauri", "crates/chess-core"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/Jotrorox/enpawssant"
publish = false

# Profiles only take effect in the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
