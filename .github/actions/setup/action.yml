name: Set up toolchains
description: >-
  Install the tools pinned in mise.toml, the Rust toolchain from
  rust-toolchain.toml, and restore the Cargo and pnpm caches.

inputs:
  cache-key:
    description: Extra key segment for the Cargo cache.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install mise tools (node, pnpm)
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        version: 2026.11.9
        install: true
        cache: true

    # Rust comes from rustup (preinstalled on the runners), not mise. The
    # toolchain file also lists both macOS targets for universal builds.
    - name: Install Rust toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
        cargo --version

    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-
