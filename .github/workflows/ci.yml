name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # fetch-stockfish queries the GitHub API; authenticate to avoid rate limits.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Rust comes from rustup (preinstalled on the runners) via rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Node and pnpm come from mise.toml.
      - uses: jdx/mise-action@v5

      - name: Lint and type-check
        run: mise run check

      - name: Test
        run: mise run test
