name: Release

on:
  push:
    tags: ["v*"]

# Never cancel a half-uploaded release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if id=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null); then
            echo "Reusing existing release $id for $TAG"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "EnPawssant $TAG"
            id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    # Signing secrets live in the `release` environment, which only `v*` tags may use.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            engine-target: universal-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            engine-target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache-key: release

      - name: Install front-end dependencies
        run: mise run install

      # tauri-build checks the per-arch sidecars; the universal bundle takes
      # stockfish-universal-apple-darwin. The script provides all of them.
      - name: Download the Stockfish sidecar
        shell: bash
        env:
          # fetch-stockfish queries the GitHub API; authenticate to avoid rate limits.
          GITHUB_TOKEN: ${{ github.token }}
          ENGINE_TARGET: ${{ matrix.engine-target }}
        run: node scripts/fetch-stockfish.mjs --target "$ENGINE_TARGET"

      # Signing is optional: secrets are only exported when all required ones
      # exist, so forks and fresh repos still produce unsigned builds.
      - name: Configure macOS signing and notarization (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { printf '%s<<__EOF__\n%s\n__EOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "Code signing enabled."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              put APPLE_ID "$APPLE_ID"
              put APPLE_PASSWORD "$APPLE_PASSWORD"
              put APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "Notarization enabled."
            else
              echo "::notice::APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID not set: signed but not notarized."
            fi
          else
            echo "::notice::Apple signing secrets not set: building an ad-hoc signed, un-notarized app."
          fi

      - name: Configure Windows signing (optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "::notice::Windows signing secrets not set: building unsigned installers."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 -Compress
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.signing.json"
          Set-Content -Path $configPath -Value $config -Encoding utf8NoBOM
          "TAURI_SIGNING_ARGS=--config $configPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Code signing enabled."

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }} ${{ env.TAURI_SIGNING_ARGS }}

      # Tauri notarizes and staples the .app, but not the .dmg around it.
      # Notarize and staple the disk image too, then replace the uploaded copy.
      # APPLE_ID etc. are only set when the signing step enabled notarization.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one DMG, found ${#dmgs[@]}: ${dmgs[*]:-none}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          name="$(basename "$dmg")"

          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
            echo "::error::$name is not attached to release $TAG; refusing to upload a differently named copy"
            exit 1
          fi

          echo "Submitting $name for notarization..."
          result="$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 2h --output-format json)"
          echo "$result"
          status="$(jq -r '.status' <<< "$result")"
          if [ "$status" != "Accepted" ]; then
            id="$(jq -r '.id' <<< "$result")"
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarization of $name finished with status: $status"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"

          gh release upload "$TAG" "$dmg" --clobber
          echo "Uploaded notarized $name"
