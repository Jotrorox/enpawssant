[package]
name = "enpawssant"
description = "EnPawssant, a cat-themed chess analysis app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enpawssant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chess-core = { path = "../crates/chess-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tauri-plugin-dialog = "2"
# The system TLS stack (Security.framework, SChannel) keeps the build free of C toolchains.
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "http2", "json", "native-tls", "query"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
base64 = "0.22"
getrandom = "0.3"
open = "5"
sha2 = "0.10"
url = "2"
# SQLite is compiled from source with the C compiler Tauri already needs, so no system library is required.
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
# Pure Rust, for the zstd-compressed Lichess puzzle database.
ruzstd = "0.9"
